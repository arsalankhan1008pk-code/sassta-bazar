<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sassta Bazar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#eef3ee}
.header{background:#0ea15a;color:white;padding:16px;text-align:center;position:relative}
.setBtn{position:absolute;right:12px;top:12px;background:#ffffff22;border:0;color:white;padding:8px 12px;border-radius:10px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0001;text-align:center}
.card img{width:100%;height:120px;object-fit:cover}
.card b{display:block;padding:10px 4px 6px;font-size:15px}
#setting{position:fixed;inset:0;background:#0008;display:none;z-index:10}
#settingBox{background:white;height:100%;width:85%;max-width:320px;padding:16px;overflow:auto;float:right}
.sItem{background:#f5f5f5;padding:12px;border-radius:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="header">
<b>Sassta Bazar</b><br><small>Har zaroorat ek bazar</small>
<button class="setBtn" onclick="document.getElementById('setting').style.display='block'">⚙️</button>
</div>

<div class="grid">
<div class="card" onclick="openCat('Company')"><img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600"><b>Company</b></div>
<div class="card" onclick="openCat('Restaurant')"><img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600"><b>Restaurant</b></div>
<div class="card" onclick="openCat('Home Good')"><img src="https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600"><b>Home Good</b></div>
<div class="card" onclick="openCat('Shop')"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600"><b>Shop</b></div>
<div class="card" onclick="openCat('Store')"><img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600"><b>Store</b></div>
</div>

<div id="setting" onclick="if(event.target==this)this.style.display='none'">
<div id="settingBox">
<h2>Setting <button onclick="document.getElementById('setting').style.display='none'" style="float:right;border:0;background:#eee;padding:6px 10px;border-radius:8px">X</button></h2>
<br>
<div class="sItem" onclick="goReg('Company')"><b>Company Registration</b></div>
<div class="sItem" onclick="goReg('Restaurant')"><b>Restaurant Registration</b></div>
<div class="sItem" onclick="goReg('Home Good')"><b>Home Good Registration</b></div>
<div class="sItem" onclick="goReg('Shop')"><b>Shop Registration</b></div>
<div class="sItem" onclick="goReg('Store')"><b>Store Registration</b></div>
<div class="sItem" style="background:#fff3e0" onclick="location.href='shikayat.html'"><b>Shikayat Box</b></div>
</div>
</div>

<script>
function openCat(c){localStorage.setItem('sb_cat',c);location.href='products.html'}
function goReg(c){localStorage.setItem('sb_cat',c);location.href='registration.html'}
</script>
</body>
</html>
