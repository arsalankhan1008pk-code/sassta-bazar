<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sassta Bazar Pakistan</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
header{background:#087b43;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0;font-size:13px}
button{border:0;border-radius:8px;padding:12px;font-size:15px;cursor:pointer}
.settings{position:fixed;right:12px;top:12px;background:#222;color:white;z-index:5}
main{padding:18px;max-width:650px;margin:auto}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.category{background:white;border:1px solid #ddd;border-radius:12px;padding:25px 8px;text-align:center;font-size:17px;font-weight:bold;min-height:100px}
.category:active{background:#e3f4e9}
input,select,textarea{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccc;border-radius:7px;font-size:15px}
.primary{background:#087b43;color:white;width:100%;margin:5px 0}
.secondary{background:#222;color:white;width:100%;margin:5px 0}
.card{background:white;padding:15px;margin:12px 0;border-radius:10px;border:1px solid #ddd}
.product{display:flex;gap:12px;align-items:center}
.product img{width:90px;height:90px;object-fit:cover;border-radius:8px;background:#eee}
.small{font-size:13px;color:#666}
.hidden{display:none!important}
h2{font-size:21px}
footer{text-align:center;padding:20px;font-size:12px;color:#777}
</style>
</head>
<body>
<header>
<h1>Sassta Bazar</h1>
<p>Har zaroorat ek bazar</p>
</header>

<button class="settings" onclick="showPage('settings')">⚙ Settings</button>

<main>
<section id="home">
<div class="categories">
<button class="category" onclick="openCategory('Company')">🏢<br>Company</button>
<button class="category" onclick="openCategory('Restaurant')">🍽️<br>Restaurant</button>
<button class="category" onclick="openCategory('Store / Mart')">🛒<br>Store / Mart</button>
<button class="category" onclick="openCategory('Shop')">🏪<br>Shop</button>
<button class="category" onclick="openCategory('Home Food')">🍲<br>Home Food</button>
<button class="category" onclick="openCategory('Accessories')">🎒<br>Accessories</button>
</div>
</section>

<section id="listing" class="hidden">
<button onclick="showPage('home')">← Wapas</button>
<h2 id="categoryTitle"></h2>
<input id="searchBox" placeholder="Business ya product search karein" oninput="renderProducts()">
<div id="businessList"></div>
<div id="productList"></div>
</section>

<section id="settings" class="hidden">
<button onclick="showPage('home')">← Wapas</button>
<h2>Settings</h2>
<button class="primary" onclick="showPage('login')">Registration</button>
<button class="secondary" onclick="showPage('complaint')">Shikayat Box</button>
</section>

<section id="login" class="hidden">
<button onclick="showPage('settings')">← Wapas</button>
<h2>Business Registration</h2>
<p class="small">Login buttons abhi demo hain. Asli login Firebase connect hone ke baad chalega.</p>
<button class="primary" onclick="alert('Google login Firebase connect hone ke baad chalega.')">Continue with Google / Gmail</button>
<button class="secondary" onclick="alert('Facebook login setup baad mein hoga.')">Continue with Facebook</button>
<hr>
<label>Business Category</label>
<select id="regCategory">
<option>Company</option><option>Restaurant</option><option>Store / Mart</option><option>Shop</option><option>Home Food</option><option>Accessories</option>
</select>
<label>Business Name</label>
<input id="businessName" placeholder="Business ka naam">
<label>City</label>
<input id="city" placeholder="Shehar">
<label>Jagah ka Naam</label>
<input id="place" placeholder="Market ya jagah">
<label>Ilaqa</label>
<input id="area" placeholder="Ilaqa">
<label>Mall / Mart / House / Shop Number</label>
<input id="shopNo" placeholder="Dukan ya ghar ka number">
<button class="primary" onclick="registerBusiness()">Registration Save Karein</button>
<p class="small">Filhal data isi browser me
