
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sassta Bazar - Companies</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf4ee;color:#222}
header{background:#0e9f5b;color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:2}
header h2{margin:0 0 6px}
.back{position:absolute;left:12px;top:22px;color:white;text-decoration:none;font-size:16px}
.search{width:100%;padding:13px;border:0;border-radius:12px;margin-top:12px;font-size:16px}
main{padding:14px;max-width:700px;margin:auto}
.card{background:white;border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 12px #0001}
.dp{height:170px;background:#dce9df;display:flex;align-items:center;justify-content:center;color:#49745a;font-size:48px}
.details{padding:15px}
.details h3{margin:0 0 10px;font-size:20px}
.details p{margin:7px 0;color:#555;font-size:15px}
.open{display:block;text-align:center;text-decoration:none;background:#0e9f5b;color:white;padding:12px;border-radius:10px;margin-top:12px;font-weight:bold}
.empty{text-align:center;padding:30px;color:#666}
.note{text-align:center;font-size:12px;color:#66736a;margin:20px}
</style>
</head>
<body>
<header>
<a class="back" href="index.html">← Back</a>
<h2>Sassta Bazar</h2>
<div>Companies in Pakistan</div>
<input class="search" id="search" placeholder="Search company, city or area">
</header>
<main id="list"></main>
<p class="note">Asal company ki details registration ke baad dikhayi jayengi.</p>
<script>
const companies=[];
const list=document.getElementById("list");
const search=document.getElementById("search");

function showCompanies(){
 const term=search.value.trim().toLowerCase();
 const found=companies.filter(c=>
 (c.name+" "+c.city+" "+c.area+" "+c.owner).toLowerCase().includes(term)
 );
 list.innerHTML="";
 if(!found.length){
 list.innerHTML='<div class="empty">Abhi koi registered company nahi mili.</div>';
 return;
 }
 found.forEach(c=>{
 const card=document.createElement("section");
 card.className="card";
 card.innerHTML=`
 <div class="dp">🏢</div>
 <div class="details">
 <h3></h3>
 <p class="owner"></p>
 <p class="city"></p>
 <p class="area"></p>
 <a class="open" href="products.html">View Products</a>
 </div>`;
 card.querySelector("h3").textContent=c.name;
 card.querySelector(".owner").textContent="Owner: "+c.owner;
 card.querySelector(".city").textContent="City: "+c.city;
 card.querySelector(".area").textContent="Area: "+c.area;
 list.appendChild(card);
 });
}
search.addEventListener("input",showCompanies);
showCompanies();
</script>
</body>
</html>
